name: Build ree-dump

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build ree-dump
        run: cargo build --release --bin ree-dump
      - name: Upload ree-dump and mhwilds dicts
        uses: actions/upload-artifact@v4
        with:
          name: ree-dump-bundle
          path: |
            target/release/ree-dump.exe
            assets/mhwilds/
