name: Build ree-save-editor

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build ree-save-editor
        run: cargo build --release -p ree-save-editor
      - name: Upload ree-save-editor and mhwilds dicts
        uses: actions/upload-artifact@v4
        with:
          name: ree-save-editor-bundle
          path: |
            target/release/ree-save-editor.exe
            assets/mhwilds/
